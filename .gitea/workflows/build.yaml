name: Cross Compile Go
run-name: Build and Bundle

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            artifact_name: ideal-linux-amd64
            release_name: linux-amd64
          - goos: linux
            goarch: arm64
            artifact_name: ideal-linux-arm64
            release_name: linux-arm64
          - goos: windows
            goarch: amd64
            artifact_name: ideal-windows-amd64.exe
            release_name: windows-amd64
          - goos: windows
            goarch: arm64
            artifact_name: ideal-windows-arm64.exe
            release_name: windows-arm64
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Task
        run: |
          go install github.com/go-task/task/v3/cmd/task@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build frontend (embedded SPA)
        run: task web:build

      - name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
        run: |
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -v -o ${{ matrix.artifact_name }} .
        shell: bash

      - name: Bundle Artifacts (Linux)
        if: matrix.goos == 'linux'
        run: |
          mkdir release-${{ matrix.release_name }}
          cp ${{ matrix.artifact_name }} release-${{ matrix.release_name }}/ideal
          cp config.json release-${{ matrix.release_name }}/
          cp README.md release-${{ matrix.release_name }}/

      - name: Bundle Artifacts (Windows)
        if: matrix.goos == 'windows'
        run: |
          mkdir release-${{ matrix.release_name }}
          cp ${{ matrix.artifact_name }} release-${{ matrix.release_name }}/ideal.exe
          cp config.json release-${{ matrix.release_name }}/
          cp README.md release-${{ matrix.release_name }}/

      - name: Upload Artifact
        uses: actions/upload-artifact@v3
        with:
          name: ${{ matrix.release_name }}
          path: release-${{ matrix.release_name }}/
          if-no-files-found: error
