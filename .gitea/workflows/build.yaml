name: Cross Compile Go
run-name: Build and Bundle

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            artifact_name: ideal-linux-amd64
            release_name: linux-amd64
            exe_name: ideal
            cc: gcc
            apt: gcc
          - goos: linux
            goarch: arm64
            artifact_name: ideal-linux-arm64
            release_name: linux-arm64
            exe_name: ideal
            cc: aarch64-linux-gnu-gcc
            apt: gcc-aarch64-linux-gnu
          - goos: windows
            goarch: amd64
            artifact_name: ideal-windows-amd64.exe
            release_name: windows-amd64
            exe_name: ideal.exe
            cc: x86_64-w64-mingw32-gcc
            apt: gcc-mingw-w64-x86-64
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install C toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ${{ matrix.apt }}

      - name: Build frontend (embedded SPA)
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
        run: |
          command -v "${{ matrix.cc }}" || { echo "C compiler not found: ${{ matrix.cc }}"; exit 1; }
          CGO_ENABLED=1 CC="${{ matrix.cc }}" \
            GOOS="${{ matrix.goos }}" GOARCH="${{ matrix.goarch }}" \
            go build -v -o "${{ matrix.artifact_name }}" .
      - name: Bundle Artifacts
        run: |
          mkdir -p "release-${{ matrix.release_name }}"
          cp "${{ matrix.artifact_name }}" "release-${{ matrix.release_name }}/${{ matrix.exe_name }}"
          cp config.json "release-${{ matrix.release_name }}/"
          cp README.md "release-${{ matrix.release_name }}/"

      - name: Upload Artifact
        uses: actions/upload-artifact@v3
        with:
          name: ${{ matrix.release_name }}
          path: release-${{ matrix.release_name }}/
          if-no-files-found: error
