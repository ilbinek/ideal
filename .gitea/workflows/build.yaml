name: Cross Compile Go
run-name: Build and Bundle

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build frontend (embedded SPA)
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Build and bundle all platforms
        run: |
          build_one() {
            local goos=$1 goarch=$2 binary=$3 release=$4 exe_name=$5
            GOOS="$goos" GOARCH="$goarch" go build -v -o "$binary" .
            mkdir -p "release-$release"
            cp "$binary" "release-$release/$exe_name"
            cp config.json "release-$release/"
            cp README.md "release-$release/"
          }
          build_one linux   amd64 ideal-linux-amd64         linux-amd64   ideal
          build_one linux   arm64 ideal-linux-arm64         linux-arm64   ideal
          build_one windows amd64 ideal-windows-amd64.exe   windows-amd64 ideal.exe
          build_one windows arm64 ideal-windows-arm64.exe   windows-arm64 ideal.exe

      - name: Upload linux-amd64
        uses: actions/upload-artifact@v3
        with:
          name: linux-amd64
          path: release-linux-amd64/
          if-no-files-found: error

      - name: Upload linux-arm64
        uses: actions/upload-artifact@v3
        with:
          name: linux-arm64
          path: release-linux-arm64/
          if-no-files-found: error

      - name: Upload windows-amd64
        uses: actions/upload-artifact@v3
        with:
          name: windows-amd64
          path: release-windows-amd64/
          if-no-files-found: error

      - name: Upload windows-arm64
        uses: actions/upload-artifact@v3
        with:
          name: windows-arm64
          path: release-windows-arm64/
          if-no-files-found: error
